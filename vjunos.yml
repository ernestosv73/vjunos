name: vjunos-lab
mgmt:
  network: juniper-ipv6
  ipv4-subnet: 172.70.70.0/24
topology:
  nodes:

    rt-prov1:
      kind: mikrotik_chr
      image: mikrotik/chr:7.24.5
      startup-config: configs/prov1.txt

    rt-prov2:
      kind: mikrotik_chr
      image: mikrotik/chr:7.24.5
      startup-config: configs/prov2.txt
      
    rt-transit:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixr-d3
      #startup-config: configs/rt-ufinet.cfg 
    
    
    rt-core:
      kind: juniper_vjunosrouter
      mgmt-ipv4: 172.70.70.10
      image: vrnetlab/juniper_vjunos-router:26.2R1.7
      startup-config: configs/vjunos.cfg

       
    PC1:
      kind: linux
      image: esanchezv/kali-python3:latest
      exec:
        - ip -6 address add 2001:db8:10::10/64 dev eth1
        #- ip -6 route del default dev eth0
        - ip -6 route add default via 2001:db8:10::1   
        
    PC2:
      kind: linux
      image: esanchezv/kali-python3:latest 
      binds:
       - configs/paquetes.sh:/root/paquetes.sh
      exec:
       - chmod +x /root/paquetes.sh
       - bash /root/paquetes.sh   
   
  links:
    
    - endpoints: ["rt-prov1:ether2", "rt-core:ge-0/0/0"]
    - endpoints: ["rt-prov2:ether2", "rt-core:ge-0/0/1"]
    - endpoints: ["rt-prov1:ether3", "rt-transit:e1-1"]
    - endpoints: ["rt-prov2:ether3", "rt-transit:e1-2"]
    - endpoints: ["rt-core:ge-0/0/2", "PC1:eth1"]
    - endpoints: ["rt-transit:e1-3", "PC2:eth1"]
    
    
